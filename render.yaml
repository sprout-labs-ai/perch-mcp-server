# Render services for the Perch MCP server (HTTP mode).
#
# ⚠ Reference only — Render does NOT read this file. Both services were
# created in the Render dashboard and are not synced to a Blueprint, so
# editing this file changes nothing in production or staging. Change a
# setting in the dashboard first, then mirror it here so this stays an
# accurate description of what is running. (Last checked against the live
# services: 2026-11-13.)
#
# The MCP server runs as a long-lived Express service (stateless POST /mcp),
# proxying Hydra-issued tokens through to perch-api.
#
# Both services track `main`:
#   - perch-mcp-server-staging  auto-deploys every commit to `main`
#   - perch-mcp-server          production; auto-deploy OFF — deploy manually
#                               from the dashboard (Manual Deploy → latest commit)
#                               once the commit has been verified on staging.
#
# Node version comes from `.nvmrc` (Render's precedence is NODE_VERSION env
# var > .node-version > .nvmrc > package.json engines). Neither service sets
# NODE_VERSION, so bump `.nvmrc` to move both. Check the build log line
# "Using Node.js version … via …" to confirm what a deploy used.
#
# Env-specific values (Hydra issuer, MCP audience, public URL, upstream API
# URL, allowed hosts) are `sync: false`: set per service in the dashboard,
# never committed.

services:
  - type: web
    name: perch-mcp-server-staging
    runtime: node
    plan: starter
    region: ohio
    branch: main
    # As configured in the dashboard. `npm ci && npm run build` would be
    # stricter (fails on a lockfile mismatch or install error instead of
    # building anyway); change it in the dashboard first if adopting it.
    buildCommand: npm install; npm run build
    startCommand: node dist/index.js --http
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PERCH_MCP_TRANSPORT
        value: http
      - key: HOST
        value: 0.0.0.0
      # Per-env — set in the dashboard (never committed):
      - key: HYDRA_ISSUER           # e.g. https://mcp-auth-staging.theperch.app
        sync: false
      - key: MCP_AUDIENCE           # e.g. https://mcp-staging.theperch.app
        sync: false
      - key: HYDRA_LEGACY_ISSUER    # optional, domain-move grace period only
        sync: false
      - key: MCP_LEGACY_AUDIENCE    # optional, domain-move grace period only
        sync: false
      - key: PERCH_MCP_PUBLIC_URL   # e.g. https://mcp-staging.theperch.app
        sync: false
      - key: PERCH_API_URL          # e.g. https://api-staging.theperch.app
        sync: false
      - key: ALLOWED_HOSTS          # e.g. mcp-staging.theperch.app
        sync: false

  - type: web
    name: perch-mcp-server
    runtime: node
    plan: starter
    region: ohio
    branch: main
    buildCommand: npm install; npm run build
    startCommand: node dist/index.js --http
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: PERCH_MCP_TRANSPORT
        value: http
      - key: HOST
        value: 0.0.0.0
      - key: HYDRA_ISSUER           # https://mcp-auth.theperch.app
        sync: false
      - key: MCP_AUDIENCE           # https://mcp.theperch.app
        sync: false
      - key: HYDRA_LEGACY_ISSUER    # optional, domain-move grace period only
        sync: false
      - key: MCP_LEGACY_AUDIENCE    # optional, domain-move grace period only
        sync: false
      - key: PERCH_MCP_PUBLIC_URL   # https://mcp.theperch.app
        sync: false
      - key: PERCH_API_URL          # https://api.theperch.app
        sync: false
      - key: ALLOWED_HOSTS          # mcp.theperch.app
        sync: false
